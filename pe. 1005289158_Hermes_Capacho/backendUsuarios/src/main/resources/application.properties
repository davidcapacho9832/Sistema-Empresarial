# ------------------------------------------------------
# Configuracion del servidor
# ------------------------------------------------------
server.port=8096

# ------------------------------------------------------
# Base de datos TiendaGenerica (MySQL / MariaDB)
# La clave NO se escribe aqui: se toma de la variable de entorno DB_PASSWORD.
# Si no defines la variable, se usa el valor que esta despues de los dos puntos,
# que debes reemplazar por tu clave local antes de ejecutar.
# ------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/tiendagenericadaeii2026?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Amigopro123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------
# JPA / Hibernate
# Las tablas ya existen (creadas por TiendaGenerica.sql), por eso ddl-auto=none.
# ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

# La tabla usa nombres en camelCase (idTipoDocumento, nombreUsuario) tal cual,
# por eso se desactiva la conversion automatica a snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ------------------------------------------------------
# Configuracion regional
# ------------------------------------------------------
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# ------------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
