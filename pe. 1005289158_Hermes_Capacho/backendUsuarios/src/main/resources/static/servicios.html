<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background-color: #343a40; color: white; }
        .main-content { padding: 30px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <div class="col-md-2 sidebar">
            <h4 class="text-center text-white mb-4">Sistema Empresarial</h4>
            <a href="dashboard.html">🏠 Inicio</a>
            <a href="usuarios.html">👥 Gestión de Usuarios</a>
            <a href="clientes.html">📦 Gestión de Clientes</a>
            <a href="servicios.html" style="background-color: #0d6efd; color: white;">🛠️ Servicios</a>
            <a href="#" onclick="cerrarSesion()" style="color: #ff6b6b; margin-top: 50px;">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido Principal -->
        <div class="col-md-10 main-content">
            <h2>Gestión de Servicios / Productos</h2>
            
            <div class="card mb-4">
                <div class="card-header bg-success text-white">Crear Nuevo Servicio</div>
                <div class="card-body">
                    <form id="formServicio" class="row g-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre del servicio (ej. Mantenimiento)" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" class="form-control" id="precioCompra" placeholder="Precio Compra" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" class="form-control" id="precioVenta" placeholder="Precio Venta" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" class="form-control" id="iva" placeholder="IVA (ej. 0.19)" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">Guardar Servicio</button>
                        </div>
                    </form>
                    <div id="mensaje" class="mt-2 fw-bold"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-primary text-white">Lista de Servicios</div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio Compra</th>
                                <th>Precio Venta</th>
                                <th>IVA</th>
                            </tr>
                        </thead>
                        <tbody id="tablaServicios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Cargar servicios al iniciar
    cargarServicios();

    async function cargarServicios() {
        try {
            const respuesta = await fetch('/api/servicios');
            const servicios = await respuesta.json();
            const tabla = document.getElementById('tablaServicios');
            tabla.innerHTML = '';
            
            servicios.forEach(s => {
                tabla.innerHTML += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.nombre}</td>
                        <td>$${s.precioCompra}</td>
                        <td>$${s.precioVenta}</td>
                        <td>${s.ivaCompra}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Error al cargar servicios:", error);
        }
    }

    // Guardar un nuevo servicio
    document.getElementById('formServicio').addEventListener('submit', async (e) => {
        e.preventDefault();
        const divMensaje = document.getElementById('mensaje');
        
        const nuevoServicio = {
            nombre: document.getElementById('nombre').value,
            precioCompra: parseFloat(document.getElementById('precioCompra').value),
            precioVenta: parseFloat(document.getElementById('precioVenta').value),
            ivaCompra: parseFloat(document.getElementById('iva').value)
        };

        try {
            const respuesta = await fetch('/api/servicios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoServicio)
            });

                       if (respuesta.ok) {
                divMensaje.innerHTML = '<span class="text-success">¡Servicio creado exitosamente!</span>';
                document.getElementById('formServicio').reset();
                cargarServicios();
            } else {
                // Esto mostrará el error real que devuelva Java
                const errorText = await respuesta.text();
                divMensaje.innerHTML = `<span class="text-danger">${errorText}</span>`;
            }
        } catch (error) {
            divMensaje.innerHTML = '<span class="text-danger">Error de conexión.</span>';
        }
    });

    function cerrarSesion() {
        localStorage.removeItem('usuarioLogueado');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
