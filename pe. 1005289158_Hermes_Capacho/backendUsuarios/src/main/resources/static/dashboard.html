<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background-color: #343a40; color: white; }
        .main-content { padding: 30px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <div class="col-md-2 sidebar">
            <h4 class="text-center text-white mb-4">Sistema Empresarial</h4>
            <a href="dashboard.html">🏠 Inicio</a>
            <a href="usuarios.html">👥 Gestión de Usuarios</a>
            <a href="clientes.html">📦 Gestión de Clientes</a>
            <a href="servicios.html">🛠️ Servicios</a>
            <a href="#" onclick="cerrarSesion()" style="color: #ff6b6b; margin-top: 50px;">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido Principal -->
        <div class="col-md-10 main-content">
            <h2>Bienvenido, <span id="nombreUsuario">Usuario</span></h2>
            <p class="text-muted">Este es el panel de control de tu proyecto.</p>
            <hr>

            <div class="card mt-4">
                <div class="card-header bg-primary text-white">
                    Lista de Usuarios del Sistema
                </div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Usuario</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <!-- Los datos se cargan con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Verificar si el usuario está logueado
    const usuario = localStorage.getItem('usuarioLogueado');
    if (!usuario) {
        window.location.href = 'index.html'; // Si no hay login, lo devuelve al inicio
    } else {
        document.getElementById('nombreUsuario').innerText = usuario;
    }

    // Cargar la lista de usuarios desde el backend
    async function cargarUsuarios() {
        try {
            const respuesta = await fetch('/api/usuarios');
            const usuarios = await respuesta.json();
            const tabla = document.getElementById('tablaUsuarios');
            
            tabla.innerHTML = ''; // Limpiar tabla
            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.numeroDocumento}</td>
                        <td>${u.nombreUsuario}</td>
                        <td>${u.email}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Error al cargar usuarios:", error);
        }
    }

    // Función para cerrar sesión
    function cerrarSesion() {
        localStorage.removeItem('usuarioLogueado');
        window.location.href = 'index.html';
    }

    // Ejecutar la carga de usuarios al abrir la página
    cargarUsuarios();
</script>

</body>
</html>
