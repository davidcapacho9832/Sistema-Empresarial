<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Genérica - Login</title>
    <!-- Bootstrap para el diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 400px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
        .btn-primary { background-color: #28a745; border: none; }
        .btn-primary:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Sistema Empresarial</h3>
    <p class="text-center text-muted">Ingresa tus credenciales</p>
    
    <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" id="usuario" class="form-control" placeholder="Ej: hcapacho">
    </div>
    <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="********">
    </div>
    
    <button onclick="hacerLogin()" class="btn btn-primary w-100">Iniciar Sesión</button>
    <div id="mensaje" class="text-center mt-3"></div>
</div>

<script>
    async function hacerLogin() {
        const usuario = document.getElementById('usuario').value;
        const password = document.getElementById('password').value;
        const divMensaje = document.getElementById('mensaje');

        if(!usuario || !password) {
            divMensaje.innerHTML = '<span class="text-danger">Por favor, llena todos los campos.</span>';
            return;
        }

        try {
            const respuesta = await fetch('/api/usuarios/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombreUsuario: usuario, password: password })
            });

            if (respuesta.ok) {
                // Si el login es correcto, guardamos el nombre en el navegador y redirigimos al panel
                localStorage.setItem('usuarioLogueado', usuario);
                window.location.href = 'dashboard.html';
            } else {
                divMensaje.innerHTML = '<span class="text-danger">Usuario o contraseña incorrectos.</span>';
            }
        } catch (error) {
            divMensaje.innerHTML = '<span class="text-danger">Error al conectar con el servidor.</span>';
        }
    }
</script>

</body>
</html>
