<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background-color: #343a40; color: white; }
        .main-content { padding: 30px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <div class="col-md-2 sidebar">
            <h4 class="text-center text-white mb-4">Sistema Empresarial</h4>
            <a href="dashboard.html">🏠 Inicio</a>
            <a href="usuarios.html" style="background-color: #0d6efd; color: white;">👥 Gestión de Usuarios</a>
            <a href="clientes.html">📦 Gestión de Clientes</a>
            <a href="servicios.html">🛠️ Servicios</a>
            <a href="#" onclick="cerrarSesion()" style="color: #ff6b6b; margin-top: 50px;">🚪 Cerrar Sesión</a>
        </div>

        <!-- Contenido Principal -->
        <div class="col-md-10 main-content">
            <h2>Gestión de Usuarios</h2>
            <p class="text-muted">Crea nuevos usuarios y consulta los existentes.</p>

            <!-- Formulario para Crear Usuario -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white">Crear Nuevo Usuario</div>
                <div class="card-body">
                    <form id="formUsuario" class="row g-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
                        </div>
                        <div class="col-md-6">
                            <input type="email" class="form-control" id="email" placeholder="Correo electrónico" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control" id="documento" placeholder="Número de documento" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control" id="username" placeholder="Nombre de usuario" required>
                        </div>
                        <div class="col-md-4">
                            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" id="tipoDoc" required>
                                <option value="5">Cédula</option>
                                <option value="6">Tarjeta</option>
                                <option value="7">Pasaporte</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">Guardar Usuario</button>
                        </div>
                    </form>
                    <div id="mensajeFormulario" class="mt-2 fw-bold"></div>
                </div>
            </div>

            <!-- Tabla de Usuarios -->
            <div class="card">
                <div class="card-header bg-primary text-white">Lista de Usuarios del Sistema</div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Usuario</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <!-- Los datos se cargan con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Cargar usuarios al iniciar
    cargarUsuarios();

    async function cargarUsuarios() {
        try {
            const respuesta = await fetch('/api/usuarios');
            const usuarios = await respuesta.json();
            const tabla = document.getElementById('tablaUsuarios');
            tabla.innerHTML = '';
            
            usuarios.forEach(u => {
                tabla.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.numeroDocumento}</td>
                        <td>${u.nombreUsuario}</td>
                        <td>${u.email}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Error al cargar usuarios:", error);
        }
    }

    // Guardar un nuevo usuario
    document.getElementById('formUsuario').addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita que la página se recargue
        const divMensaje = document.getElementById('mensajeFormulario');
        
        const nuevoUsuario = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            numeroDocumento: document.getElementById('documento').value,
            nombreUsuario: document.getElementById('username').value,
            password: document.getElementById('password').value,
            idTipoDocumento: parseInt(document.getElementById('tipoDoc').value)
        };

        try {
            const respuesta = await fetch('/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoUsuario)
            });

            if (respuesta.ok) {
                divMensaje.innerHTML = '<span class="text-success">¡Usuario creado exitosamente!</span>';
                document.getElementById('formUsuario').reset(); // Limpiar formulario
                cargarUsuarios(); // Recargar la tabla
            } else {
                const error = await respuesta.json();
                divMensaje.innerHTML = `<span class="text-danger">Error: ${error.mensaje || 'Datos inválidos'}</span>`;
            }
        } catch (error) {
            divMensaje.innerHTML = '<span class="text-danger">Error de conexión.</span>';
        }
    });

    function cerrarSesion() {
        localStorage.removeItem('usuarioLogueado');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
