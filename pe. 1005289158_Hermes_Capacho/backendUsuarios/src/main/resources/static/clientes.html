<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background-color: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background-color: #343a40; color: white; }
        .main-content { padding: 30px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- MENÚ LATERAL CORREGIDO -->
        <div class="col-md-2 sidebar">
            <h4 class="text-center text-white mb-4">Sistema Empresarial</h4>
            <a href="dashboard.html">🏠 Inicio</a>
            <a href="usuarios.html">👥 Gestión de Usuarios</a>
            <a href="clientes.html" style="background-color: #0d6efd; color: white;">📦 Gestión de Clientes</a>
            <a href="servicios.html">🛠️ Servicios</a>
            <a href="#" onclick="cerrarSesion()" style="color: #ff6b6b; margin-top: 50px;">🚪 Cerrar Sesión</a>
        </div>
        
        <div class="col-md-10 main-content">
            <h2>Gestión de Clientes</h2>
            <div class="card mb-4">
                <div class="card-header bg-success text-white">Crear Nuevo Cliente</div>
                <div class="card-body">
                    <form id="formCliente" class="row g-3">
                        <div class="col-md-6"><input type="text" class="form-control" id="nombre" placeholder="Nombre" required></div>
                        <div class="col-md-6"><input type="email" class="form-control" id="email" placeholder="Correo" required></div>
                        <div class="col-md-4"><input type="text" class="form-control" id="documento" placeholder="Documento" required></div>
                        <div class="col-md-4"><input type="text" class="form-control" id="direccion" placeholder="Dirección" required></div>
                        <div class="col-md-4"><input type="text" class="form-control" id="telefono" placeholder="Teléfono" required></div>
                        <div class="col-md-4">
                            <select class="form-select" id="tipoDoc" required>
                                <option value="5">Cédula</option>
                                <option value="6">Tarjeta</option>
                                <option value="7">Pasaporte</option>
                            </select>
                        </div>
                        <div class="col-12"><button type="submit" class="btn btn-success">Guardar Cliente</button></div>
                    </form>
                    <div id="mensaje" class="mt-2 fw-bold"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header bg-primary text-white">Lista de Clientes</div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead><tr><th>ID</th><th>Nombre</th><th>Documento</th><th>Email</th><th>Teléfono</th></tr></thead>
                        <tbody id="tablaClientes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    // Cargar clientes al iniciar
    cargarClientes();

    async function cargarClientes() {
        try {
            const respuesta = await fetch('/api/clientes');
            const clientes = await respuesta.json();
            const tabla = document.getElementById('tablaClientes');
            tabla.innerHTML = '';
            clientes.forEach(c => {
                tabla.innerHTML += `<tr><td>${c.id}</td><td>${c.nombre}</td><td>${c.numeroDocumento}</td><td>${c.email}</td><td>${c.telefono}</td></tr>`;
            });
        } catch (error) {
            console.error("Error al cargar clientes:", error);
        }
    }

    // Guardar cliente
    document.getElementById('formCliente').addEventListener('submit', async (e) => {
        e.preventDefault();
        const divMensaje = document.getElementById('mensaje');
        
        const nuevoCliente = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            numeroDocumento: document.getElementById('documento').value,
            direccion: document.getElementById('direccion').value,
            telefono: document.getElementById('telefono').value,
            idTipoDocumento: parseInt(document.getElementById('tipoDoc').value)
        };

        try {
            const resp = await fetch('/api/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoCliente)
            });

            if (resp.ok) {
                divMensaje.innerHTML = '<span class="text-success">Cliente guardado exitosamente</span>';
                document.getElementById('formCliente').reset();
                cargarClientes();
            } else {
                const errorText = await resp.text();
                divMensaje.innerHTML = `<span class="text-danger">Error: ${errorText}</span>`;
            }
        } catch (error) {
            divMensaje.innerHTML = '<span class="text-danger">Error de conexión con el servidor.</span>';
            console.error(error);
        }
    });

    // FUNCIÓN DE CERRAR SESIÓN QUE FALTABA
    function cerrarSesion() {
        localStorage.removeItem('usuarioLogueado');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
